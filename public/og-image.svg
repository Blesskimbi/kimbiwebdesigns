<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0c10;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4f8ef0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <!-- Accent bar -->
  <rect x="80" y="260" width="6" height="110" fill="url(#accent)" rx="3" />
  <!-- Main text -->
  <text x="116" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1">Bless Kimbi</text>
  <text x="116" y="358" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#94a3b8">Web Designer &amp; Developer — Yaoundé, Cameroon</text>
  <!-- Tagline -->
  <text x="116" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#64748b">Fast · Modern · SEO-Optimised Websites for Businesses in Africa</text>
  <!-- URL -->
  <text x="116" y="530" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#4f8ef0">everythx.com</text>
  <!-- Decorative circle -->
  <circle cx="1050" cy="315" r="180" fill="none" stroke="#4f8ef0" stroke-width="1" opacity="0.15" />
  <circle cx="1050" cy="315" r="130" fill="none" stroke="#4f8ef0" stroke-width="1" opacity="0.10" />
  <circle cx="1050" cy="315" r="80" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.20" />
</svg>
